apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-next
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE_ME/devop-assignment.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-next
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true

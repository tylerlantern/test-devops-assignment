apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-next
  namespace: hello-next
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-next
  template:
    metadata:
      labels:
        app: hello-next
    spec:
      containers:
        - name: web
          image: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/hello-next:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
